# Generates data-store passwords once and renders them as Terraform input.
#   ansible-playbook playbooks/bootstrap-secrets.yml
# Passwords persist in ansible/.secrets/<key> (gitignored), so re-runs are idempotent.
# Terraform turns them into Kubernetes Secrets (ADR-011).
- name: Bootstrap data-store secrets for Terraform
  hosts: localhost
  gather_facts: false
  vars:
    secrets_dir: "{{ playbook_dir }}/../.secrets"
    tfvars_file: "{{ playbook_dir }}/../../terraform/secrets.auto.tfvars.json"
    datastore_password_keys:
      - dc1_pg_ecommerce
      - dc1_pg_keycloak
      - dc1_cassandra_superuser
      - dc1_keycloak_admin
      - dc2_pg_ecommerce
      - dc2_mongo_analytics
      - dc2_rustfs_secret_key
      - grafana_admin
      - icinga_ticket_salt
      - icinga_api_root
      - icinga_api_icingaweb
      - icingaweb_admin
      - monitoring_pg_icinga
      # Phase 4.5: Keycloak client platform-seeder (terraform/keycloak) and the shared
      # password of the synthetic shoppers (data-tools).
      - dc1_keycloak_seeder_client
      - data_tools_user_password
  tasks:
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Create or reuse one password per key
      ansible.builtin.set_fact:
        datastore_passwords: >-
          {{ datastore_passwords | default({}) | combine({
               item: lookup('ansible.builtin.password', secrets_dir ~ '/' ~ item,
                            chars=['ascii_letters', 'digits'], length=32)
             }) }}
      loop: "{{ datastore_password_keys }}"
      no_log: true

    - name: Render terraform/secrets.auto.tfvars.json
      ansible.builtin.copy:
        dest: "{{ tfvars_file }}"
        content: "{{ {'datastore_passwords': datastore_passwords} | to_nice_json }}\n"
        mode: "0600"
      no_log: true
