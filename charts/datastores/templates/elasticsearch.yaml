{{- with .Values.elasticsearch }}
{{- if .enabled }}
# ECK-managed Elasticsearch. HTTP TLS is off (in-cluster only); auth stays on and the
# password of user "elastic" is in Secret <name>-es-elastic-user, key "elastic".
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: {{ .name }}
spec:
  version: {{ .version | quote }}
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: {{ .count }}
      config:
        # Avoids the vm.max_map_count host sysctl requirement on k3d nodes.
        node.store.allow_mmap: false
      podTemplate:
        metadata:
          labels:
            {{ $.Values.roleLabel | quote }}: elasticsearch
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms{{ .heap }} -Xmx{{ .heap }}"
              {{- with .resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: {{ .storage }}
{{- end }}
{{- end }}
