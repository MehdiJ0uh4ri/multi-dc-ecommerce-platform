{{- with .Values.mongodb }}
{{- if .enabled }}
# MongoDB Community via the mongodb-kubernetes operator. For each user the operator writes
# Secret <name>-<db>-<user> with key connectionString.standard.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ .name }}
spec:
  members: {{ .members }}
  type: ReplicaSet
  version: {{ .version | quote }}
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    {{- range .users }}
    - name: {{ .name }}
      db: {{ .db }}
      passwordSecretRef:
        name: {{ .passwordSecret }}
      scramCredentialsSecretName: {{ $.Values.mongodb.name }}-{{ .name }}-scram
      roles:
        {{- toYaml .roles | nindent 8 }}
    {{- end }}
  statefulSet:
    spec:
      template:
        metadata:
          labels:
            {{ $.Values.roleLabel | quote }}: mongodb
        {{- with .resources }}
        spec:
          containers:
            - name: mongod
              resources:
                {{- toYaml . | nindent 16 }}
        {{- end }}
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            storageClassName: local-path
            resources:
              requests:
                storage: {{ .storage }}
{{- end }}
{{- end }}
