# DC1 data stores (charts/datastores). Sized for the dc1-core quota (terraform/variables.tf).

postgres:
  enabled: true
  name: pg-dc1
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  parameters:
    max_connections: "200"
    shared_buffers: "64MB"
  owner:
    role: ecommerce
    database: ecommerce
    secret: pg-dc1-ecommerce        # terraform/datastores-dc1.tf
    replication: true               # Debezium CDC (ADR-014)
  roles:
    - name: keycloak
      secret: pg-dc1-keycloak
  # DC1 services only; favourite/rating/media/promotion get the DC2 instance (ADR-006).
  # Names from app/docker/postgres/init/create-all-databases.sql.
  databases:
    - { name: keycloak, owner: keycloak }
    - { name: authservice, owner: ecommerce }
    - { name: productservice, owner: ecommerce }
    - { name: orderservice, owner: ecommerce }
    - { name: paymentservice, owner: ecommerce }
    - { name: shippingservice, owner: ecommerce }
    - { name: inventoryservice, owner: ecommerce }
    - { name: taxservice, owner: ecommerce }

kafka:
  enabled: true
  name: kafka-dc1
  storage: 5Gi
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "1", memory: 1Gi }
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1
    auto.create.topics.enable: true
  entityOperator:
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 384Mi }

# Debezium change-data-capture (ADR-014). Toggled by var.enable_cdc.
# Converters match what app/search-service expects: plain JSON key/value, Debezium
# envelope with top-level "op" (ProductSyncDataConsumer).
kafkaConnect:
  enabled: true
  name: connect-dc1
  bootstrapServers: kafka-dc1-kafka-bootstrap:9092
  image: registry.localhost:5000/platform/kafka-connect-dc1:debezium-3.6.2-cassandra-sink-1.7.6-kafka-4.3.1
  pushOptions: ["--tls-verify=false"]   # k3d registry is plain HTTP
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  plugins:
    - name: debezium-connector-postgres
      artifacts:
        - type: tgz
          url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.6.2.Final/debezium-connector-postgres-3.6.2.Final-plugin.tar.gz
          sha512sum: eabc5416446a32c3c763749262cd03115fbc2804bf48018348184f660222e9e5c8395306d9e795c9d52cbe246a5386142bdae376d418f6cf1bd5233e83e8ffe7
    # Kafka -> Cassandra sink (helm-values/dc1-core/cassandra-sink.yaml, ADR-007).
    - name: datastax-cassandra-sink
      artifacts:
        - type: tgz
          url: https://github.com/datastax/kafka-sink/releases/download/1.7.6/kafka-connect-cassandra-sink-1.7.6.tar.gz
          sha512sum: 90f5f937a5942c45d1126d1d020d828e8df257cf27261493f10f1e8a79d0f7fe212d5ab0f06b31acfd4166a0fedd86f90438e0c5592072970160f456d992d76f
  env:
    - name: PG_DC1_USER
      valueFrom:
        secretKeyRef: { name: pg-dc1-ecommerce, key: username }
    - name: PG_DC1_PASSWORD
      valueFrom:
        secretKeyRef: { name: pg-dc1-ecommerce, key: password }
    - name: CASSANDRA_DC1_USER
      valueFrom:
        secretKeyRef: { name: cassandra-dc1-superuser, key: username }
    - name: CASSANDRA_DC1_PASSWORD
      valueFrom:
        secretKeyRef: { name: cassandra-dc1-superuser, key: password }
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: "1", memory: 768Mi }
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 384m
  buildResources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

cassandra:
  enabled: true                     # overridden by var.enable_cassandra
  clusterName: ecommerce
  datacenter: dc1
  serverVersion: 4.1.9              # k8ssandra/cass-management-api:4.1.9 exists on Docker Hub
  storage: 5Gi
  heap: 512m
  superuserSecret: cassandra-dc1-superuser
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "1", memory: 1536Mi }
  systemLoggerResources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  configBuilderResources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Target of cassandra-sink-orders (helm-values/dc1-core/cassandra-sink.yaml).
  bootstrapCql:
    - "CREATE KEYSPACE IF NOT EXISTS ecommerce WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': 1};"
    - "CREATE TABLE IF NOT EXISTS ecommerce.orders_by_id (order_id int PRIMARY KEY, order_desc text, order_fee double, product_id int, cart_id int);"
